<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="D120競艇ダイス">
<title>D120競艇ダイス</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151e30;--line:#2a3850;--text:#f4f7fb;--muted:#a8b4c7;--accent:#63d5bd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#1b2a43 0,#0b1020 60%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px;margin:8px 0 2px;letter-spacing:.04em}header p{margin:0;color:var(--muted);font-size:12px}
.pill{border:1px solid var(--line);background:#172338;color:var(--muted);border-radius:999px;padding:8px 12px;font-size:12px}
#stage{height:min(53vh,420px);min-height:300px;position:relative;margin:8px -8px 4px;touch-action:pan-y}
#stage canvas{display:block;width:100%;height:100%}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:0 0 14px}
.panel{background:linear-gradient(145deg,#18243a,#111a2b);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 12px 35px #0004}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row label{font-size:14px;font-weight:600}
select{background:#0e1728;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 30px 10px 12px;font-size:16px}
button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer}
#roll{width:100%;background:linear-gradient(100deg,#63d5bd,#8ce6d2);color:#06231f;box-shadow:0 8px 24px #63d5bd33;margin-top:14px}
#roll:disabled{opacity:.55}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-top:12px}
.result{background:#0c1525;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.result small{display:block;color:var(--muted);margin-bottom:7px}.numbers{font-size:26px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
#summary{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.record-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.record-inputs label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.record-inputs input{width:100%;min-width:0;background:#0e1728;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px}
.small-btn{background:#26344b;color:var(--text);padding:9px 12px;font-size:12px;border:1px solid var(--line);border-radius:10px}
.danger{margin-top:12px;color:#ffaaa5}
.stats{color:var(--muted);font-size:13px;line-height:1.8;margin:12px 0}
.history-item{background:#0c1525;border:1px solid var(--line);border-radius:13px;padding:12px;margin:10px 0;font-size:13px}
.history-head{display:flex;justify-content:space-between;gap:8px;color:var(--muted);margin-bottom:7px}
.history-numbers{font-size:21px;font-weight:800;color:var(--accent);letter-spacing:.08em;margin:5px 0}
.history-meta{color:var(--muted);line-height:1.7;overflow-wrap:anywhere}
.history-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.history-controls label{font-size:11px;color:var(--muted)}
.history-controls select,.history-controls input{width:100%;margin-top:4px;padding:8px;font-size:13px}
@media(max-width:380px){.record-inputs{grid-template-columns:1fr}}
footer{text-align:center;color:#718098;font-size:11px;padding:12px}
</style>
</head>
<body>
<main>
<header><div><h1>🎲 D120競艇ダイス</h1><p>競艇予想用・120面体3数字ダイス</p></div><span class="pill">1面に数字3つ / 1〜6</span></header>
<div id="stage" aria-label="3Dの120面体サイコロ"></div>
<p class="hint">サイコロをドラッグして回転できます</p>
<section class="panel">
 <div class="row"><label for="count">振るサイコロの数</label><select id="count"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
 <div class="record-inputs">
  <label>競艇場 <input id="venue" placeholder="例：住之江"></label>
  <label>レース <input id="race" placeholder="例：12R"></label>
  <label>購入金額（円） <input id="stake" type="number" min="0" step="100" placeholder="例：1000"></label>
  <label>買い目・メモ <input id="bet" placeholder="例：1-4-6 / 3連単"></label>
 </div>
 <button id="roll">🎲　まとめて振る</button>
 <div id="results" class="results"></div>
 <div id="summary">「まとめて振る」を押してスタート</div>
</section>
<section class="panel" id="historyPanel">
 <div class="row"><strong>📒 出目・レース履歴</strong><button id="exportHistory" class="small-btn">CSV出力</button></div>
 <div id="stats" class="stats">履歴はまだありません</div>
 <div id="historyList"></div>
 <button id="clearHistory" class="small-btn danger">履歴をすべて削除</button>
</section>
<footer>ホーム画面に追加：Safariの共有ボタン →「ホーム画面に追加」</footer>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const stage=document.querySelector('#stage'), countEl=document.querySelector('#count'), rollBtn=document.querySelector('#roll'), resultsEl=document.querySelector('#results'), summary=document.querySelector('#summary');
const venueEl=document.querySelector('#venue'), raceEl=document.querySelector('#race'), stakeEl=document.querySelector('#stake'), betEl=document.querySelector('#bet');
const historyList=document.querySelector('#historyList'), statsEl=document.querySelector('#stats');
const HISTORY_KEY='d120-race-history-v1';
let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
function saveHistory(){localStorage.setItem(HISTORY_KEY,JSON.stringify(history));renderHistory()}
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function yen(n){return Number(n||0).toLocaleString('ja-JP')+'円'}
function renderHistory(){
 if(!history.length){historyList.innerHTML='<p class="history-meta">履歴はこの端末のブラウザ内に保存されます。別端末とは共有されません。</p>';statsEl.textContent='履歴はまだありません';return}
 const settled=history.filter(h=>h.status!=='未判定');
 const totalStake=history.reduce((s,h)=>s+Number(h.stake||0),0);
 const totalPayout=history.reduce((s,h)=>s+Number(h.payout||0),0);
 const hits=history.filter(h=>h.status==='的中').length;
 statsEl.textContent='記録 '+history.length+'件 ／ 判定済み '+settled.length+'件 ／ 的中 '+hits+'件 ／ 購入 '+yen(totalStake)+' ／ 払戻 '+yen(totalPayout)+' ／ 収支 '+(totalPayout-totalStake>=0?'+':'')+yen(totalPayout-totalStake);
 historyList.innerHTML=history.map(h=>'<article class="history-item" data-id="'+esc(h.id)+'"><div class="history-head"><span>'+esc(new Date(h.time).toLocaleString('ja-JP'))+'</span><button class="small-btn delete-one" type="button">削除</button></div><div><strong>'+esc(h.venue||'競艇場未入力')+' '+esc(h.race||'レース未入力')+'</strong></div><div class="history-numbers">'+h.values.map(v=>v.join('・')).join('　／　')+'</div><div class="history-meta">購入：'+yen(h.stake)+' ／ 買い目：'+esc(h.bet||'未入力')+'</div><div class="history-controls"><label>結果<select class="status"><option '+(h.status==='未判定'?'selected':'')+'>未判定</option><option '+(h.status==='的中'?'selected':'')+'>的中</option><option '+(h.status==='不的中'?'selected':'')+'>不的中</option></select></label><label>払戻金（円）<input class="payout" type="number" min="0" step="100" value="'+Number(h.payout||0)+'"></label></div></article>').join('');
}
historyList.addEventListener('change',e=>{const item=e.target.closest('.history-item');if(!item)return;const h=history.find(x=>x.id===item.dataset.id);if(!h)return;if(e.target.classList.contains('status'))h.status=e.target.value;if(e.target.classList.contains('payout'))h.payout=Math.max(0,Number(e.target.value)||0);localStorage.setItem(HISTORY_KEY,JSON.stringify(history));renderHistory()});
historyList.addEventListener('click',e=>{if(!e.target.classList.contains('delete-one'))return;const item=e.target.closest('.history-item');history=history.filter(h=>h.id!==item.dataset.id);saveHistory()});
document.querySelector('#clearHistory').addEventListener('click',()=>{if(confirm('保存した履歴をすべて削除します。よろしいですか？')){history=[];saveHistory()}});
document.querySelector('#exportHistory').addEventListener('click',()=>{if(!history.length){alert('出力する履歴がありません');return}const rows=[['日時','競艇場','レース','出目','購入金額','買い目・メモ','結果','払戻金'],...history.map(h=>[new Date(h.time).toLocaleString('ja-JP'),h.venue,h.race,h.values.map(v=>v.join('-')).join(' / '),h.stake,h.bet,h.status,h.payout])];const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='D120_競艇履歴.csv';a.click();URL.revokeObjectURL(a.href)});
renderHistory();
const scene=new THREE.Scene();scene.background=null;
const camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,0,7.8);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9f7ff,0x26334d,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(4,5,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x65d9c2,1.1);fill.position.set(-5,-2,3);scene.add(fill);
const diceGroup=new THREE.Group();scene.add(diceGroup);
const baseGeo=new THREE.IcosahedronGeometry(1.35,0);
const pos=baseGeo.getAttribute('position');
const unique=[], map=new Map();
function getV(i){const v=new THREE.Vector3().fromBufferAttribute(pos,i);const k=v.toArray().map(n=>n.toFixed(5)).join(',');if(!map.has(k)){map.set(k,unique.length);unique.push(v)}return map.get(k)}
const baseFaces=[];
for(let i=0;i<pos.count;i+=3)baseFaces.push([getV(i),getV(i+1),getV(i+2)]);
const midCache=new Map();
function midpoint(a,b){const k=[Math.min(a,b),Math.max(a,b)].join(':');if(!midCache.has(k)){midCache.set(k,unique.length);unique.push(unique[a].clone().add(unique[b]).multiplyScalar(.5).normalize().multiplyScalar(1.35))}return midCache.get(k)}
const materials=[];
function faceTexture(nums){
 const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
 x.clearRect(0,0,256,256);x.fillStyle='rgba(8,22,36,.88)';x.beginPath();x.moveTo(128,12);x.lineTo(244,226);x.lineTo(12,226);x.closePath();x.fill();
 x.strokeStyle='#75e5d0';x.lineWidth=5;x.stroke();
 x.fillStyle='#ffffff';x.textAlign='center';x.textBaseline='middle';x.font='bold 47px sans-serif';
 x.fillText(nums[0],128,75);x.fillText(nums[1],83,166);x.fillText(nums[2],173,166);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const faceMeshes=[];
let faceIndex=0;
function addFace(a,b,c){
 const va=unique[a],vb=unique[b],vc=unique[c];const center=va.clone().add(vb).add(vc).divideScalar(3);
 const normal=vb.clone().sub(va).cross(vc.clone().sub(va)).normalize();if(normal.dot(center)<0){[b,c]=[c,b]}
 const A=unique[a],B=unique[b],C=unique[c];
 const nums=[1,2,3,4,5,6].sort(()=>Math.random()-.5).slice(0,3);
 const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute([...A.toArray(),...B.toArray(),...C.toArray()],3));geometry.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,1,0,.5,1],2));geometry.computeVertexNormals();
 const material=new THREE.MeshStandardMaterial({map:faceTexture(nums),side:THREE.DoubleSide,roughness:.48,metalness:.18});
 const mesh=new THREE.Mesh(geometry,material);diceGroup.add(mesh);faceMeshes.push(mesh);materials.push(material);
 const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geometry),new THREE.LineBasicMaterial({color:0x9df4e3,transparent:true,opacity:.72}));diceGroup.add(edges);
 faceIndex++;
}
for(const [a,b,c] of baseFaces){const ab=midpoint(a,b),bc=midpoint(b,c),ca=midpoint(c,a);const g=unique.length;unique.push(unique[a].clone().add(unique[b]).add(unique[c]).divideScalar(3));addFace(a,ab,g);addFace(ab,b,g);addFace(b,bc,g);addFace(bc,c,g);addFace(c,ca,g);addFace(ca,a,g)}
const outer=new THREE.Mesh(new THREE.IcosahedronGeometry(1.365,0),new THREE.MeshBasicMaterial({color:0x9df4e3,wireframe:true,transparent:true,opacity:.16}));diceGroup.add(outer);
let drag=false,lastX=0,lastY=0,velX=.003,velY=.005;
stage.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;diceGroup.rotation.y+=dx*.009;diceGroup.rotation.x+=dy*.009;velY=dx*.0005;velX=dy*.0005;lastX=e.clientX;lastY=e.clientY});
stage.addEventListener('pointerup',()=>drag=false);stage.addEventListener('pointercancel',()=>drag=false);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
let rolling=false;
function animate(){requestAnimationFrame(animate);if(!drag&&!rolling){diceGroup.rotation.y+=velY;diceGroup.rotation.x+=velX;velX*=.985;velY*=.985;if(Math.abs(velX)<.00005)velX=.00008;if(Math.abs(velY)<.00005)velY=.00012}renderer.render(scene,camera)}animate();
function randomTriple(){return [1,2,3,4,5,6].sort(()=>Math.random()-.5).slice(0,3)}
rollBtn.addEventListener('click',()=>{
 if(rolling)return;rolling=true;rollBtn.disabled=true;const n=Number(countEl.value);const values=Array.from({length:n},randomTriple);
 const record={id:Date.now().toString(36)+Math.random().toString(36).slice(2),time:new Date().toISOString(),venue:venueEl.value.trim(),race:raceEl.value.trim(),stake:Math.max(0,Number(stakeEl.value)||0),bet:betEl.value.trim(),values,status:'未判定',payout:0};
 const startX=diceGroup.rotation.x,startY=diceGroup.rotation.y;const start=performance.now(),duration=1450+Math.random()*450;
 function spin(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3);diceGroup.rotation.x=startX+ease*Math.PI*(3+Math.random()*.05);diceGroup.rotation.y=startY+ease*Math.PI*(4+Math.random()*.05);if(t<1){requestAnimationFrame(spin)}else{rolling=false;rollBtn.disabled=false;resultsEl.innerHTML=values.map((v,i)=>'<div class="result"><small>ダイス '+(i+1)+'</small><div class="numbers">'+v.join('・')+'</div></div>').join('');summary.textContent='出目：'+values.map(v=>v.join('')).join(' ／ ');history.unshift(record);if(history.length>500)history=history.slice(0,500);saveHistory();velX=.0001;velY=.00015}}
 requestAnimationFrame(spin);
});
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script>
</body>
</html>
